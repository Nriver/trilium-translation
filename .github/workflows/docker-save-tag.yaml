name: docker镜像tag存档
on:
  workflow_dispatch: #github页面手动触发
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Initialization environment
        run : |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"
          
      - name: Checkout
        uses: actions/checkout@main
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ref: main

      - name: Check and download remote files
        run: |
          wget https://github.com/Nriver/trilium-translation/releases/download/v0.64.1_20261106/trilium-linux-x64-server-0.64.1-cn.tar.xz
          # wget https://github.com/Nriver/trilium-translation/releases/latest/download/trilium-linux-x64-server-0.64.1-cn.tar.xz 
          tar -xf trilium-linux-x64-server-0.64.1-cn.tar.xz 
          rm -f trilium-linux-x64-server-0.64.1-cn.tar.xz
          sed -i '/electron/d' ./trilium-linux-x64-server/package.json

      - name: Show files
        run: |
          pwd
          ls

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile_github_action
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/trilium-cn,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/trilium-cn:0.64.1 \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/trilium-cn@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/trilium-cn:0.64.1
